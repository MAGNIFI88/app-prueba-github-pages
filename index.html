<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Mini App</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; margin-top: 50px; background-color: #f4f4f9; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 5px; }
        button:hover { background: #0056b3; }
    </style>
</head>
<body>
    <h1>¡Hola! Bienvenido a mi Mini App</h1>
    <p>Desplegada con éxito en GitHub Pages.</p>
    <button onclick="saludar()">Haz clic aquí</button>
    <p id="mensaje"></p>

    <script>
        function saludar() {
            document.getElementById("mensaje").innerText = "¡Gracias por interactuar con la app! 🚀";
        }
    </script>
</body>
</html>
